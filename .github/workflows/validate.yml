name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install openpyxl python-docx PyYAML
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils
      - name: Validate all skills and run offline tests
        run: |
          python scripts/validate_skills.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Confirm CI contains no live federal calls
        run: |
          if grep -RInE 'requests\.(get|post)|urllib\.request|curl +https?://(api\.)?(sam|usaspending|gsa|bls|regulations|federalregister|ecfr)' tests scripts; then
            echo "Live federal network code is forbidden in skills CI."
            exit 1
          fi
